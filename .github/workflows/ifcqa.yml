name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-auditor:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ifcqa
          POSTGRES_USER: ifcqa
          POSTGRES_PASSWORD: ifcqa123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ifcqa
      POSTGRES_USER: ifcqa
      POSTGRES_PASSWORD: ifcqa123

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auditor/requirements.txt

      - name: Seed database
        run: |
          python auditor/app/main.py seed

      - name: Run audit test
        run: |
          python auditor/app/main.py audit samples/sample.ifc --ruleset rulesets/revit-export.json --output output

      - name: Verify output files
        run: |
          test -f output/audit_report.json
          test -f output/issue.csv