name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python-auditor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r auditor/requirements.txt

      - name: Run audit test
        run: |
          python auditor/app/main.py audit samples/sample.ifc --ruleset rulesets/revit-export.json --output output

      - name: Verify output files
        run: |
          test -f output/audit_report.json
          test -f output/issue.csv