<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IfcQA Report</title>
    <style>
        :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --line: #e5e7eb;
    --pill: #f3f4f6;

    --leftMin: 320px;
    --leftMax: 760px;
    --leftW: 520px;
    --gutterW: 10px;
}

html {
    scrollbar-gutter: stable;
    overflow-y: scroll;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

body.resizing {
    cursor: col-resize;
    user-select: none;
}

body.resizing #viewerCanvas {
    width: 100% !important;
    height: 100% !important;
    display: block;
}

a {
    color: inherit;
}

.hidden {
    display: none !important;
}

.small {
    font-size: 12px;
    color: var(--muted);
}

.muted {
    opacity: 0.65;
    font-weight: 500;
}

.mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}


.layout {
    position: relative;
    display: block;
    margin: 0;
    padding: 0;
}

.leftPanel {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--leftW);
    height: 100vh;
    overflow: scroll;
    padding: 16px;
    box-sizing: border-box;
    background: var(--bg);
    border-right: 1px solid rgba(0, 0, 0, 0.12);
    z-index: 2;
}

.no-select {
    user-select: none;
    -webkit-user-select: none;
}

.splitter {
    position: fixed;
    top: 0;
    left: var(--leftW);
    width: var(--gutterW);
    height: 100vh;
    cursor: col-resize;
    z-index: 5;
    background: rgba(0, 0, 0, 0.04);
}

.splitter:hover {
    background: rgba(0, 0, 0, 0.08);
}

.splitter::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: 50%;
    width: 1px;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.18);
}

.rightPanel {
    position: fixed;
    top: 0;
    left: calc(var(--leftW) + var(--gutterW));
    right: 0;
    height: 100vh;
    overflow: hidden;
    box-sizing: border-box;
    z-index: 1;
}

.wrap {
    max-width: 1200px;
    margin: 0 auto;
}


.viewerPane {
    height: calc(100vh - 32px);
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.12);
    background: #000;
}

#viewerCanvas {
    width: 100%;
    height: 100%;
    display: block;
}


.h1 {
    font-size: 18px;
    font-weight: 750;
    margin: 0 0 6px;
    letter-spacing: 0.2px;
}

.meta {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 10px;
    word-break: break-all;
}

.meta::after {
    content: "";
    display: block;
    height: 1px;
    background: var(--line);
    margin-top: 12px;
}

.copyright {
    color: var(--muted);
    font-size: 12px;
    margin: 8px 0 10px;
    word-break: break-all;
}


.grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin: 12px 0 14px;
}

.card {
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    border-radius: 12px;
    padding: 10px 10px;
}

.k {
    color: var(--muted);
    font-size: 12px;
    margin: 0 0 6px;
    text-align: center;
}

.v {
    font-size: 18px;
    font-weight: 500;
    text-align: center;
}


.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 10px 0 10px;
}

.dropdown {
    display: inline-flex;
}

select,
input {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
}

input {
    flex: 1;
}

.pill {
    display: inline-flex;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--pill);
    border: 1px solid var(--line);
    font-size: 12px;
    color: var(--muted);
    flex: 0 0 auto;
    width: auto;
}

.pill-toggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}

.pill-toggle input[type="checkbox"] {
    accent-color: #7ab7ff;
    width: 14px;
    height: 14px;
    margin: 0;
    flex: 0 0 14px;
    display: inline-block;
}

.pill-toggle input[type="file"] {
    display: none;
}

.btn {
    background: var(--pill);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    cursor: pointer;
}

.btnSmall {
    padding: 6px 10px;
    font-size: 12px;
}


.chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin: 8px 0 10px;
}

.chip {
    border: 1px solid var(--line);
    background: var(--pill);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 10px;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
}

.chip.active {
    border-color: #004492;
    box-shadow: 0 0 0 2px rgba(122, 183, 255, 0.15) inset;
}


.tableWrap {
    overflow: auto;
    max-height: calc(100vh - 380px);
    border-radius: 12px;
}

.table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
}

th,
td {
    text-align: left;
    padding: 6px 14px;
    border-bottom: 1px solid var(--line);
}

th {
    font-size: 12px;
    color: var(--muted);
    font-weight: 700;
    position: sticky;
    top: 0;
    background: #f9fafb;
    z-index: 1;
}


tr:hover td {
    background: #f9fafb;
}

tbody tr[data-idx] {
    cursor: pointer;
    font-size: 14px;
}

tbody tr[data-idx].selected {
    outline: 2px solid rgba(122, 183, 255, 0.6);
    outline-offset: -2px;
    background: rgba(122, 183, 255, 0.08);
}

.sev {
    font-weight: 700;
}

.sev.Error {
    color: #b91c1c;
}

.sev.Warning {
    color: #b45309;
}

.sev.Info {
    color: #1d4ed8;
}

.ruleOneLine,
.nameOneLine {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.msgTwoLine {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.copy {
    cursor: pointer;
    text-decoration: underline;
    text-decoration-color: rgba(232, 238, 252, 0.25);
}


.floatingCopy {
    position: fixed;
    z-index: 50;
    padding: 6px 10px;
    border: 1px solid rgba(0, 0, 0, 0.16);
    background: #fff;
    font-size: 11px;
    cursor: pointer;
    min-width: 100px;
    height: 28px;
    text-align: center;
    box-shadow: 2px 2px 1px 0 rgba(0, 0, 0, 0.4);
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

.floatingCopy:hover {
    background: rgb(221, 221, 221);
}

.floatingCopy .icon {
    width: 14px;
    height: 14px;
}

.floatingCopy.copied {
    background: rgb(221, 221, 221);
}

.floatingCopy.copied::after {
    font-size: 12px;
}

.drawerEdgeClose {
    position: fixed;
    z-index: 999;
    width: 28px;
    height: 56px;
    border-radius: 0 10px 10px 0;
    border: 1px solid rgba(0, 0, 0, 0.16);
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.10);
}

.drawerEdgeClose.hidden {
    display: none !important;
}

.overlay {
    display: none !important;
}

.drawer {
    position: absolute;
    inset: 0;
    width: auto;
    height: auto;
    border-left: 0;
    box-shadow: none;
    height: 100vh;
    background: var(--card);
    z-index: 20;
    display: flex;
    flex-direction: column;
}

.leftPanel.drawerOpen #drawer {
    display: flex;
}

#drawer.hidden {
    display: none !important;
}


.drawerHeader {
    padding: 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: start;
    gap: 10px;
}

.drawerTitle {
    font-weight: 750;
}

.drawerSubtitle {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
    word-break: break-word;
}

.drawerBody {
    padding: 14px;
    overflow: auto;
}

.kv {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 10px 12px;
    align-items: start;
}

.kv .k {
    color: var(--muted);
    font-size: 12px;
    text-align: left;
    margin: 0;
}

.kv .v {
    font-size: 14px;
    word-break: break-word;
    text-align: left;
}

#dRuleInfo {
    white-space: pre-line;
}

.section {
    margin-top: 14px;
}

.sectionTitle {
    font-weight: 700;
    margin-bottom: 8px;
}

.messageBox {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    white-space: pre-wrap;
    font-size: 14px;
}


.footer {
    margin-top: 14px;
    color: var(--muted);
    font-size: 12px;
}


@media (max-width:900px) {
    .rightPanel {
        position: relative;
        height: auto;
    }

    .tableWrap {
        max-height: none;
    }

    .viewerPane {
        height: 50vh;
    }

    .grid {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width:560px) {
    .grid {
        grid-template-columns: 1fr;
    }
}
    </style>
</head>

        </aside>
        <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panels">

        <main class="rightPanel">

//#region Helpers (general)

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function uniq(arr) {
  return Array.from(new Set(arr)).sort();
}

function addOptions(select, label, values) {
  if (!select) return;
  select.innerHTML = "";
  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = label;
  select.appendChild(opt0);
  values.forEach((v) => {
    const o = document.createElement("option");
    o.value = v;
    o.textContent = v;
    select.appendChild(o);
  });
}

function severityRank(sev) {
  if (sev === "Error") return 0;
  if (sev === "Warning") return 1;
  return 2;
}

//#endregion


//#region URL State (hash sync)

function getStateFromUI() {
  return {
    sev: fSeverity?.value || "",
    rule: fRule?.value || "",
    cls: fClass?.value || "",
    q: fText?.value || "",
    group: (fGroup && fGroup.checked) ? "1" : "0",
  };
}

function applyStateToUI(state) {
  if (!state) return;

  if (state.sev != null && fSeverity) fSeverity.value = state.sev;
  if (state.rule != null && fRule) fRule.value = state.rule;
  if (state.cls != null && fClass) fClass.value = state.cls;
  if (state.q != null && fText) fText.value = state.q;
  if (fGroup) fGroup.checked = state.group === "1";

  const sevChips = document.getElementById("sevChips");
  if (sevChips && fSeverity) {
    const v = fSeverity.value || "";
    sevChips.querySelectorAll(".chip").forEach((c) => {
      c.classList.toggle("active", (c.dataset.sev ?? "") === v);
    });
  }
}

function writeStateToHash(state) {
  const p = new URLSearchParams();
  if (state.sev) p.set("sev", state.sev);
  if (state.rule) p.set("rule", state.rule);
  if (state.cls) p.set("cls", state.cls);
  if (state.q) p.set("q", state.q);
  if (state.group === "1") p.set("group", "1");
  const hash = p.toString();
  history.replaceState(null, "", hash ? `#${hash}` : "#");
}

function readStateFromHash() {
  const hash = (location.hash || "").replace(/^#/, "");
  const p = new URLSearchParams(hash);
  return {
    sev: p.get("sev") || "",
    rule: p.get("rule") || "",
    cls: p.get("cls") || "",
    q: p.get("q") || "",
    group: p.get("group") || "0",
  };
}

//#endregion


//#region Filters + Matching

function matches(issue) {
  if (activeRuleIds && !activeRuleIds.has(issue.ruleId)) return false;

  const sev = fSeverity?.value || "";
  const rule = fRule?.value || "";
  const cls = fClass?.value || "";
  const q = (fText?.value || "").trim().toLowerCase();

  if (sev && issue.severity !== sev) return false;
  if (rule && issue.ruleId !== rule) return false;
  if (cls && issue.ifcClass !== cls) return false;

  if (!q) return true;

  return (
    (issue.globalId || "").toLowerCase().includes(q) ||
    (issue.name || "").toLowerCase().includes(q) ||
    (issue.message || "").toLowerCase().includes(q)
  );
}

//#endregion


//#region Rendering (flat / grouped / root)

function renderFlat(filtered) {
  rows.innerHTML = "";
  const frag = document.createDocumentFragment();

  filtered.forEach((i, idx) => {
    const tr = document.createElement("tr");
    tr.dataset.idx = String(idx);
    tr.dataset.gid = i.globalId || "";

    const tdSev = document.createElement("td");
    tdSev.className = `col-sev sev ${i.severity}`;
    tdSev.textContent = i.severity || "";

    const tdRule = document.createElement("td");
    tdRule.className = "col-rule ruleOneLine";
    tdRule.title = i.ruleId || "";
    tdRule.textContent = i.ruleId || "";

    const tdClass = document.createElement("td");
    tdClass.className = "col-class ruleOneLine";
    tdClass.title = i.ifcClass || "";
    tdClass.textContent = i.ifcClass || "";

    const tdName = document.createElement("td");
    tdName.className = "col-name small nameOneLine";
    tdName.title = i.name || "";
    tdName.textContent = i.name || "";

    const tdMsg = document.createElement("td");
    tdMsg.className = "col-msg";
    tdMsg.innerHTML = `<div class="msgTwoLine">${escapeHtml(i.message || "")}</div>`;

    tr.append(tdSev, tdRule, tdClass, tdName, tdMsg);
    frag.appendChild(tr);
  });

  rows.appendChild(frag);
}

function renderGrouped(filtered) {
  rows.innerHTML = "";
  window.__viewIssues = [];

  const groups = new Map();
  filtered.forEach((i) => {
    if (!groups.has(i.ruleId)) groups.set(i.ruleId, []);
    groups.get(i.ruleId).push(i);
  });

  const ruleIds = Array.from(groups.keys()).sort((a, b) => {
    const la = groups.get(a);
    const lb = groups.get(b);
    const ra = severityRank(la[0]?.severity);
    const rb = severityRank(lb[0]?.severity);
    if (ra !== rb) return ra - rb;
    return (a || "").localeCompare(b || "");
  });

  const frag = document.createDocumentFragment();

  ruleIds.forEach((ruleId) => {
    const list = groups.get(ruleId);
    const sev = list[0]?.severity || "Info";
    const meta = rulesetMetaByRuleId[ruleId] || {};

    const trGroup = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 6;

    const details = document.createElement("details");
    details.open = true;

    const summary = document.createElement("summary");
    summary.style.cursor = "pointer";
    summary.innerHTML = `
      <span class="sev ${sev}">${sev}</span>
      <span style="margin-left:10px;font-weight:800;">${escapeHtml(ruleId || "")}</span>
      <span class="pill" style="margin-left:10px;">${list.length} issues</span>
      ${meta.title ? `<span class="small" style="margin-left:10px;">${escapeHtml(meta.title)}</span>` : ""}
    `;

    const body = document.createElement("div");
    body.style.marginTop = "10px";

    if (meta.why) {
      const why = document.createElement("div");
      why.className = "small";
      why.style.margin = "0 0 10px";
      why.textContent = `Why it matters: ${meta.why}`;
      body.appendChild(why);
    }

    const inner = document.createElement("table");
    inner.className = "table";
    inner.innerHTML = `
      <thead>
        <tr>
          <th style="width:140px;">IfcClass</th>
          <th style="width:200px;">Name</th>
          <th>Message</th>
        </tr>
      </thead>
      <tbody></tbody>
    `;

    const tbody = inner.querySelector("tbody");

    list
      .slice()
      .sort(
        (a, b) =>
          (a.ifcClass || "").localeCompare(b.ifcClass || "") ||
          (a.name || "").localeCompare(b.name || "") ||
          (a.globalId || "").localeCompare(b.globalId || "")
      )
      .forEach((i) => {
        const tr = document.createElement("tr");

        window.__viewIssues.push(i);
        tr.dataset.idx = String(window.__viewIssues.length - 1);
        tr.dataset.gid = i.globalId || "";

        const tdClass = document.createElement("td");
        tdClass.className = "ruleOneLine";
        tdClass.title = i.ifcClass || "";
        tdClass.textContent = i.ifcClass || "";

        const tdName = document.createElement("td");
        tdName.className = "small nameOneLine";
        tdName.title = i.name || "";
        tdName.textContent = i.name || "";

        const tdMsg = document.createElement("td");
        tdMsg.innerHTML = `<div class="msgTwoLine">${escapeHtml(i.message || "")}</div>`;

        tr.append(tdClass, tdName, tdMsg);
        tbody.appendChild(tr);
      });

    body.appendChild(inner);
    details.append(summary, body);
    td.appendChild(details);
    trGroup.appendChild(td);
    frag.appendChild(trGroup);
  });

  rows.appendChild(frag);
}

function render() {
  const filtered = issues.filter(matches);

  filtered.sort((a, b) => {
    const ra = severityRank(a.severity);
    const rb = severityRank(b.severity);
    if (ra !== rb) return ra - rb;
    return (a.ruleId || "").localeCompare(b.ruleId || "") ||
      (a.ifcClass || "").localeCompare(b.ifcClass || "") ||
      (a.name || "").localeCompare(b.name || "") ||
      (a.globalId || "").localeCompare(b.globalId || "");
  });

  window.__currentFiltered = filtered;
  shown.textContent = `${filtered.length} shown`;

  if (fGroup && fGroup.checked) {
    renderGrouped(filtered);
  } else {
    window.__viewIssues = filtered;
    renderFlat(filtered);
  }
}

function rerenderAndPersist() {
  writeStateToHash(getStateFromUI());
  render();
}

//#region Drawer

function openDrawer(issue) {
  currentIssue = issue;

  dTitle.textContent = issue.ruleId || "Issue";
  dSubtitle.textContent = `${issue.ifcClass || ""} • ${issue.name || ""}`.trim();

  dSeverity.textContent = issue.severity || "";
  dRule.textContent = issue.ruleId || "";
  dClass.textContent = issue.ifcClass || "";
  dGlobalId.textContent = issue.globalId || "";
  dName.textContent = issue.name || "";
  dMessage.textContent = issue.message || "";
  dPath.textContent = issue.path || "";
  dSource.textContent = issue.source || "";
  dExpected.textContent = issue.expected || "";
  dActual.textContent = issue.actual || "";

  const meta = rulesetMetaByRuleId[issue.ruleId];
  if (meta && (meta.title || meta.why || meta.description || meta.howToFix)) {
    dRuleMeta.classList.remove("hidden");
    dRuleInfo.textContent = [
      meta.title ? `Title: ${meta.title}` : "",
      meta.why ? `Why it matters: ${meta.why}` : "",
      meta.howToFix ? `How to fix: ${meta.howToFix}` : "",
      meta.description ? `Description: ${meta.description}` : "",
      meta.references && meta.references.length ? `References: ${meta.references.join(", ")}` : "",
    ].filter(Boolean).join("\n");
  } else {
    dRuleMeta.classList.add("hidden");
    dRuleInfo.textContent = "";
  }

  leftPanel.classList.add("drawerOpen");
  drawer.classList.remove("hidden");
  drawer.setAttribute("aria-hidden", "false");
  showDrawerClose();
}

function closeDrawer() {
  leftPanel.classList.remove("drawerOpen");
  drawer.classList.add("hidden");
  drawer.setAttribute("aria-hidden", "true");
  currentIssue = null;
  hideDrawerClose();
}

// Drawer events
dClose?.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
});

dCopy?.addEventListener("click", async () => {
  const txt = (currentIssue && currentIssue.globalId) || "";
  if (!txt) return;
  try {
    await navigator.clipboard.writeText(txt);
    dCopy.textContent = "Copied!";
    setTimeout(() => (dCopy.textContent = "Copy"), 700);
  } catch {
    prompt("Copy GlobalId:", txt);
  }
});

//#region Row Selection + Viewer Events (hover/select)

function clearSelectedRow() {
  document.querySelectorAll("tr.selected").forEach(el => el.classList.remove("selected"));
}

function selectRowByGid(gid) {
  clearSelectedRow();
  if (!gid) return;
  const tr = document.querySelector(`tr[data-gid="${CSS.escape(gid)}"]`);
  if (tr) tr.classList.add("selected");
}

function clearSelection() {
  selectedGid = "";
  clearSelectedRow();
  hideFloatingCopy();
  window.dispatchEvent(new CustomEvent("ifcqa:clear"));
}

// Clear selection when clicking empty areas
document.addEventListener("pointerdown", (e) => {
  const t = e.target;

  if (
    t.closest('tr[data-gid]') ||
    t.closest("#floatingCopyBtn") ||
    t.closest(".controls") ||
    t.closest(".chips") ||
    t.closest(".drawer") ||
    t.closest("#viewerPane") ||
    t.closest("#drawerEdgeClose")
  ) {
    return;
  }

  clearSelection();
}, {
  capture: true
});

rows.addEventListener("click", async (e) => {
  const copyEl = e.target.closest(".copy");
  if (copyEl) {
    const txt = copyEl.dataset.copy || "";
    try {
      await navigator.clipboard.writeText(txt);
      const prev = copyEl.textContent;
      copyEl.textContent = "Copied!";
      setTimeout(() => (copyEl.textContent = prev), 600);
    } catch {
      prompt("Copy GlobalId:", txt);
    }
    return;
  }

  const tr = e.target.closest('tr[data-idx]');
  if (!tr) return;

  const idx = Number(tr.dataset.idx);
  const issue = window.__viewIssues?.[idx];
  if (!issue) return;

  selectedGid = issue.globalId || "";
  selectRowByGid(selectedGid);
  showFloatingCopy(tr);
  window.dispatchEvent(new CustomEvent("ifcqa:select", { detail: { gid: selectedGid } }));
  openDrawer(issue);
});

rows.addEventListener("mouseover", (e) => {
  const tr = e.target.closest("tr[data-idx]");
  if (!tr) return;

  const idx = Number(tr.dataset.idx);
  if (__hoveredIdx === idx) return;
  __hoveredIdx = idx;

  const issue = window.__viewIssues?.[idx];
  const gid = issue?.globalId || tr.dataset.gid || null;

  window.dispatchEvent(new CustomEvent("ifcqa:hover", { detail: { gid } }));
});

rows.addEventListener("mouseout", (e) => {
  const tr = e.target.closest("tr[data-idx]");
  if (!tr) return;

  const to = e.relatedTarget;
  if (to && tr.contains(to)) return;

  __hoveredIdx = null;
  window.dispatchEvent(new CustomEvent("ifcqa:hover", { detail: { gid: null } }));
});

//#region Splitter

const saved = Number(localStorage.getItem("ifcqa:leftW"));
if (!Number.isNaN(saved) && saved > 0) {
  root.style.setProperty("--leftW", `${saved}px`);
  requestAnimationFrame(() => {
    if (typeof window.ifcqaViewerResize === "function") window.ifcqaViewerResize();
  });
}

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
};

let dragging = false;
let rafId = 0;
let nextW = 0;

function applyWidth(w) {
  root.style.setProperty("--leftW", `${w}px`);
  if (typeof positionCloseButton === "function") positionCloseButton();
};

function scheduleApply() {
  if (rafId) return;
  rafId = requestAnimationFrame(() => {
    rafId = 0;
    applyWidth(nextW);
  });
};

splitter.addEventListener("pointerdown", (e) => {
  dragging = true;
  splitter.setPointerCapture(e.pointerId);
  document.body.classList.add("resizing");
  document.body.classList.add("no-select");
  window.dispatchEvent(new Event("ifcqa:dragstart"));

  const min = 320;
  const max = Math.max(min + 50, window.innerWidth - 320);

  splitter.dataset.min = String(min);
  splitter.dataset.max = String(max);
});

splitter.addEventListener("pointermove", (e) => {
  if (!dragging) return;

  const min = Number(splitter.dataset.min || 320);
  const max = Number(splitter.dataset.max || (window.innerWidth - 320));

  nextW = clamp(e.clientX, min, max);
  scheduleApply();
});

function endDrag(e) {
  if (!dragging) return;

  dragging = false;
  document.body.classList.remove("resizing");
  document.body.classList.remove("no-select");

  const w = parseFloat(getComputedStyle(root).getPropertyValue("--leftW")) || nextW || 520;
  localStorage.setItem("ifcqa:leftW", String(Math.round(w)));
  window.dispatchEvent(new Event("ifcqa:layout"));

  try {
    splitter.releasePointerCapture(e.pointerId);
  } catch { }
};

splitter.addEventListener("pointerup", (e) => {
  window.dispatchEvent(new Event("ifcqa:dragend"));
  endDrag(e);
});

splitter.addEventListener("pointercancel", (e) => {
  window.dispatchEvent(new Event("ifcqa:dragend"));
  endDrag(e);
});

window.addEventListener("resize", () => {
  const current = parseFloat(getComputedStyle(root).getPropertyValue("--leftW")) || 520;
  const min = 320;
  const max = Math.max(min + 50, window.innerWidth - 320);
  const clamped = clamp(current, min, max);
  applyWidth(clamped);
});

const drawerEdgeClose = document.getElementById("drawerEdgeClose");

function positionCloseButton() {

  const btnH = drawerEdgeClose.offsetHeight || 56;

  drawerEdgeClose.classList.remove("hidden");
  requestAnimationFrame(positionCloseButton());
}

function hideDrawerClose() {
  drawerEdgeClose.classList.add("hidden");

});

//#region Floating Copy Button

function positionFloatingCopy(rowEl) {
  if (!rowEl || !floatingCopyBtn) return;

  const panelRect = leftPanel.getBoundingClientRect();
  const rowRect = rowEl.getBoundingClientRect();

  const btnRect = floatingCopyBtn.getBoundingClientRect();
  const left = panelRect.right - 36 - (btnRect.width || 44);
  const top = rowRect.top + rowRect.height / 2 - (btnRect.height || 28) / 2;

  floatingCopyBtn.style.left = `${left}px`;
  floatingCopyBtn.style.top = `${top}px`;
}

function showFloatingCopy(rowEl) {
  if (!floatingCopyBtn) return;

  activeRowEl = rowEl;
  activeGid = rowEl?.dataset?.gid || "";
  if (!activeGid) return;

  floatingCopyBtn.classList.remove("hidden");
  positionFloatingCopy(rowEl);
}

function hideFloatingCopy() {
  if (!floatingCopyBtn) return;

  activeRowEl = null;
  activeGid = "";
  floatingCopyBtn.classList.add("hidden");
}

leftPanel.addEventListener("scroll", () => {
  if (activeRowEl) positionFloatingCopy(activeRowEl);
});

rows.addEventListener("pointermove", (e) => {
  const tr = e.target.closest("tr");
  if (!tr || !rows.contains(tr)) return;
  if (tr === activeRowEl) return;
  showFloatingCopy(tr);
});

leftPanel.addEventListener("pointermove", (e) => {
  const tr = e.target.closest('tr[data-gid]');
  if (!tr) return;
  if (tr === activeRowEl) return;
  showFloatingCopy(tr);
});

leftPanel.addEventListener("pointerleave", (e) => {
  if (e.relatedTarget && floatingCopyBtn.contains(e.relatedTarget)) return;
  hideFloatingCopy();
});

tableWrap?.addEventListener("pointerleave", (e) => {
  if (e.relatedTarget && floatingCopyBtn.contains(e.relatedTarget)) return;
  hideFloatingCopy();
});

floatingCopyBtn?.addEventListener("pointerleave", (e) => {
  if (e.relatedTarget && (tableWrap.contains(e.relatedTarget) || leftPanel.contains(e.relatedTarget))) return;
  hideFloatingCopy();
});

tableWrap.addEventListener("pointermove", (e) => {
  const tr = e.target.closest("tr[data-gid]");
  if (tr) {
    if (tr !== activeRowEl) showFloatingCopy(tr);
    return;
  }

  if (selectedGid) return;

  if (e.target === floatingCopyBtn || floatingCopyBtn.contains(e.target)) return;
  hideFloatingCopy();
});

tableWrap.addEventListener("pointerleave", (e) => {
  if (e.relatedTarget && floatingCopyBtn.contains(e.relatedTarget)) return;
  hideFloatingCopy();
});

floatingCopyBtn.addEventListener("pointerleave", (e) => {
  if (e.relatedTarget && tableWrap.contains(e.relatedTarget)) return;
  hideFloatingCopy();
});

floatingCopyBtn?.addEventListener("click", async (e) => {
  e.stopPropagation();
  if (!activeGid) return;

  try {
    await navigator.clipboard.writeText(activeGid);

    if (floatingCopyLabel) floatingCopyLabel.textContent = "Copied";
    floatingCopyBtn.classList.add("copied");
    requestAnimationFrame(() => positionFloatingCopy(activeRowEl));

    setTimeout(() => {
      if (floatingCopyLabel) floatingCopyLabel.textContent = "Copy GlobalID";
      floatingCopyBtn.classList.remove("copied");
      requestAnimationFrame(() => positionFloatingCopy(activeRowEl));
    }, 600);
  } catch { }
});

const sevChips = document.getElementById("sevChips");
if (sevChips) {
  sevChips.addEventListener("click", (e) => {

    if (!btn) return;

    const sev = btn.dataset.sev ?? "";

    sevChips.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));

    rerenderAndPersist();
  });

[fRule, fClass].forEach((s) => s && s.addEventListener("change", rerenderAndPersist));

fSeverity?.addEventListener("change", () => {
  if (sevChips && fSeverity) {
    const v = fSeverity.value || "";
    sevChips.querySelectorAll(".chip").forEach((c) => {
      c.classList.toggle("active", (c.dataset.sev ?? "") === v);
    });
  }
  rerenderAndPersist();
});

fText?.addEventListener("input", rerenderAndPersist);
fGroup?.addEventListener("change", rerenderAndPersist);

//#region Ruleset JSON Decoration

function setRulesetActive(isActive) {
  if (!btnClearRuleset) return;
  btnClearRuleset.classList.toggle("hidden", !isActive);
}

rulesetFile?.addEventListener("change", async () => {
  const f = rulesetFile.files?.[0];
  if (!f) return;

  try {
    const text = await f.text();
    const rs = JSON.parse(text);

    activeRuleIds = new Set((rs.rules || []).map(r => r.id));
    setRulesetActive(true);

    const map = {};
    (rs.rules || []).forEach((r) => {
      const m = r.meta || {};
      map[r.id] = {
        title: m.title || r.title || "",
        why: m.why || r.whyItMatters || r.why || "",
        howToFix: m.howToFix || "",
        description: r.description || m.description || "",
        references: Array.isArray(m.references) ? m.references : []
      };
    });

    rulesetMetaByRuleId = map;
    rerenderAndPersist();
  } catch (err) {
    alert("Failed to load ruleset JSON.");
    console.error(err);
  }
});

btnClearRuleset?.addEventListener("click", () => {
  activeRuleIds = null;
  rulesetMetaByRuleId = data.rulesetMeta || {};
  setRulesetActive(false);
  rerenderAndPersist();
});

//#region CSV Export + Share Link

function csvEscape(v) {
  const s = (v ?? "").toString();
  if (/[",\n]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function toCsv(rows) {
  const header = ["severity", "ruleId", "ifcClass", "globalId", "name", "message"];
  const lines = [header.join(",")];

  for (const r of rows) {
    lines.push([
      csvEscape(r.severity),
      csvEscape(r.ruleId),
      csvEscape(r.ifcClass),
      csvEscape(r.globalId),
      csvEscape(r.name),
      csvEscape(r.message),
    ].join(","));
  }

  return lines.join("\n");
}

btnExportCsv?.addEventListener("click", () => {
  const filtered = window.__currentFiltered || [];
  const csv = toCsv(filtered);

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "ifcqa_filtered.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();

  URL.revokeObjectURL(url);
});

btnCopyLink?.addEventListener("click", async () => {
  const url = location.href;
  try {
    await navigator.clipboard.writeText(url);
    btnCopyLink.textContent = "Copied!";
    setTimeout(() => (btnCopyLink.textContent = "Copy share link"), 800);
  } catch {
    prompt("Copy link:", url);
  }
});

//#endregion


//#region Init

addOptions(fSeverity, "Severity (All)", ["Error", "Warning", "Info"]);
addOptions(fRule, "Rule ID (All)", uniq(issues.map((i) => i.ruleId)));
addOptions(fClass, "IfcClass (All)", uniq(issues.map((i) => i.ifcClass)));

applyStateToUI(readStateFromHash());
setRulesetActive(false);
rerenderAndPersist();

//#endregion
