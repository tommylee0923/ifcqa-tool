<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IfcQA Report</title>
    <style>
        /* { { CSS } } */
    </style>
</head>

<body>


    <div class="layout">
        <!-- LEFT -->
        <aside class="leftPanel">
            <button id="floatingCopyBtn" class="floatingCopy hidden" type="button" title="Copy GlobalId">
                <svg class="icon" xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 448 512"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                    <path
                        d="M384 336l-192 0c-8.8 0-16-7.2-16-16l0-256c0-8.8 7.2-16 16-16l133.5 0c4.2 0 8.3 1.7 11.3 4.7l58.5 58.5c3 3 4.7 7.1 4.7 11.3L400 320c0 8.8-7.2 16-16 16zM192 384l192 0c35.3 0 64-28.7 64-64l0-197.5c0-17-6.7-33.3-18.7-45.3L370.7 18.7C358.7 6.7 342.5 0 325.5 0L192 0c-35.3 0-64 28.7-64 64l0 256c0 35.3 28.7 64 64 64zM64 128c-35.3 0-64 28.7-64 64L0 448c0 35.3 28.7 64 64 64l192 0c35.3 0 64-28.7 64-64l0-16-48 0 0 16c0 8.8-7.2 16-16 16L64 464c-8.8 0-16-7.2-16-16l0-256c0-8.8 7.2-16 16-16l16 0 0-48-16 0z" />
                </svg>
                <span class="label">Copy GlobalID</span>
            </button>
            <div class="wrap">
                <div class="h1">IfcQA Report</div>
                <div id="meta" class="meta"></div>
                <div class="right">Generated by Tommy Lee · IfcQA v0.4.0</div>
                <div class="grid">
                    <div class="card">
                        <div class="k">Total</div>
                        <div id="cTotal" class="v">0</div>
                    </div>
                    <div class="card">
                        <div class="k">Errors</div>
                        <div id="cErrors" class="v">0</div>
                    </div>
                    <div class="card">
                        <div class="k">Warnings</div>
                        <div id="cWarnings" class="v">0</div>
                    </div>
                    <div class="card">
                        <div class="k">Info</div>
                        <div id="cInfo" class="v">0</div>
                    </div>
                </div>

                <div class="controls">
                    <span class="dropdown">
                        <select id="fSeverity"></select>
                        <select id="fRule"></select>
                        <select id="fClass"></select>
                    </span>

                    <label class="pill pill-toggle">
                        <input id="fGroup" type="checkbox" />
                        Group by rule
                    </label>

                    <input id="fText" type="text" placeholder="Search GlobalID / Name / Message..." />
                    <span id="shown" class="pill">0 shown</span>
                    <button id="btnExportCsv" class="btn btnSmall">Export filtered CSV</button>
                    <button id="btnCopyLink" class="btn btnSmall">Copy share link</button>
                </div>

                <div class="chips" id="sevChips">
                    <button class="chip active" data-sev="">All</button>
                    <button class="chip" data-sev="Error">Errors</button>
                    <button class="chip" data-sev="Warning">Warnings</button>
                    <button class="chip" data-sev="Info">Info</button>
                </div>

                <div class="tableWrap">
                    <table class="table">
                        <thead>
                            <tr>
                                <th class="col-sev" style="width:110px;">Severity</th>
                                <th class="col-rule" style="width:120px;">Rule</th>
                                <th class="col-class" style="width:140px;">IfcClass</th>
                                <th class="col-name" style="width:200px;">Name</th>
                                <th class="col-msg">Message</th>
                            </tr>
                        </thead>
                        <tbody id="rows"></tbody>
                    </table>
                </div>

                <div id="drawerOverlay" class="overlay hidden"></div>
                <aside id="drawer" class="drawer hidden" aria-hidden="true">
                    <div class="drawerHeader">
                        <button id="dClose" class="btn">
                            <svg id="leftCloseArrow" xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                                <path
                                    d="M201.4 297.4C188.9 309.9 188.9 330.2 201.4 342.7L361.4 502.7C373.9 515.2 394.2 515.2 406.7 502.7C419.2 490.2 419.2 469.9 406.7 457.4L269.3 320L406.6 182.6C419.1 170.1 419.1 149.8 406.6 137.3C394.1 124.8 373.8 124.8 361.3 137.3L201.3 297.3z" />
                            </svg>
                        </button>
                        <div>
                            <div id="dTitle" class="drawerTitle">Issue</div>
                            <div id="dSubtitle" class="drawerSubtitle"></div>
                        </div>
                    </div>

                    <div class="drawerBody">
                        <div class="kv">
                            <div class="k">Severity</div>
                            <div id="dSeverity" class="v"></div>
                            <div class="k">Rule</div>
                            <div id="dRule" class="v"></div>
                            <div class="k">IfcClass</div>
                            <div id="dClass" class="v"></div>
                            <div class="k">GlobalId</div>
                            <div class="v">
                                <span id="dGlobalId" class="mono"></span>
                                <button id="dCopy" class="btn btnSmall">Copy</button>
                            </div>
                            <div class="k">Name</div>
                            <div id="dName" class="v"></div>
                            <div class="k">Path</div>
                            <div id="dPath" class="v mono"></div>
                            <div class="k">Source</div>
                            <div id="dSource" class="v"></div>
                            <div class="k">Expected</div>
                            <div id="dExpected" class="v"></div>
                            <div class="k">Actual</div>
                            <div id="dActual" class="v"></div>
                        </div>

                        <div class="section">
                            <div class="sectionTitle">Message</div>
                            <div id="dMessage" class="messageBox"></div>
                        </div>

                        <div id="dRuleMeta" class="section hidden">
                            <div class="sectionTitle">Rule info</div>
                            <div id="dRuleInfo" class="small"></div>
                        </div>
                    </div>
                </aside>
            </div>

            <div class="footer">Tip: click a GlobalId to copy it.</div>
        </aside>

        <!-- RIGHT -->
        <main class="rightPanel">
            <div id="viewerPane" class="viewerPane">
                <canvas id="viewerCanvas"></canvas>
            </div>
            <!-- leave viewerInfo alone like you asked -->
            <div id="viewerInfo" style="margin-top:8px; font-family: monospace; font-size: 12px;"></div>
        </main>
    </div>
    </div>
    <div id="viewerInfo" style="margin-top:8px; font-family: monospace; font-size: 12px;"></div>



    <script id="data" type="application/json">
  {{DATA_JSON}}
  </script>

    <script>
        // { { JS } }
    </script>
    <script src="./viewer/viewer.bundle.js"></script>
</body>

</html>
